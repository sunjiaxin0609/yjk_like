  - generic [ref=e158]:
    - paragraph [ref=e159]:
      - text: 当前路线：
      - generic [ref=e160]: P4 规范验算与配筋（进行中）
      - generic [ref=e161]: P5 工程化
      - text: 。
    - paragraph [ref=e162]: 建议：以 「P4 并行小里程碑 · P4-D1 交互建模闭环补全」 立项，理由：
    - list [ref=e163]:
      - listitem [ref=e164]: 与 P4 解耦：不触碰验算/配筋数据流，无依赖冲突，可并行；
      - listitem [ref=e165]: 收益前置：P4-T5 配筋实配需要「工程师能从空白建出真实工程」做验收载体验证， 空白建模恰是前置条件；
      - listitem [ref=e166]: 风险可控：核心全部复用，改动集中在 GUI 一层，回归只需 1 条端到端用例 （新建 → 轴网 → 增补 → 另存 → run），与现有 23 个测试目标互不干扰。
    - paragraph [ref=e167]: 里程碑划分（每步独立可验收、单独 commit）：
    - list [ref=e168]:
      - listitem [ref=e169]: D1-1 新建空白工程：菜单动作 + 空白初始化链路（复用 §2.4 重置链），0.5 人日；
      - listitem [ref=e170]: D1-2 轴网生成对话框：NewProjectDialog 调 GridMesh 生成 + 撤销入栈，1.5～2 人日； 验收：新建后直接 F5 可算出结果，Ctrl+Z 可撤销整个轴网；
      - listitem [ref=e171]:
        - text: D1-3 端到端用例：
        - code [ref=e172]: ui
        - text: 无头脚本新场景 （
        - code [ref=e173]: "--script 内建空白 → 生成 → run"
        - text: ），并入现有 ctest，0.5 人日。
